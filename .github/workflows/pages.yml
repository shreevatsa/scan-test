# Publishes only webapp/ (about 24 MB) to GitHub Pages, at <site>/webapp/, instead of the whole repository.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}webapp/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: webapp
          sparse-checkout-cone-mode: true
      - name: Stage the site
        run: |
          mkdir _site
          cp -r webapp _site/webapp
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=webapp/"><a href="webapp/">webapp/</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
